services:
  backend:
    build: ./backend
    container_name: kpit_backend
    restart: always
    environment:
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      - ./backend:/app
      - ./robot_tests:/app/robot_tests    # <-- AJOUTER CETTE LIGNE
    ports:
      - "5000:5000"
    networks:
      - kpit_network

  frontend:
    build: ./frontend
    container_name: kpit_frontend
    restart: always
    ports:
      - "9900:80"
    depends_on:
      - backend
    networks:
      - kpit_network

networks:
  kpit_network:
    driver: bridge