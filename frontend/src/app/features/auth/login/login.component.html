<div class="login-container">
  <mat-card class="login-card">
    
    <mat-card-header>
      <mat-card-title class="login-title">
        <mat-icon class="title-icon">lock</mat-icon>
        KPIT Auth Platform
      </mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        
        <!-- Login Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput 
                 formControlName="login" 
                 placeholder="Enter your username"
                 autocomplete="username"
                 [disabled]="isLoading">
          <mat-icon matPrefix>person</mat-icon>
          
          <mat-error *ngIf="loginField?.hasError('required')">
            Username is required
          </mat-error>
          <mat-error *ngIf="loginField?.hasError('minlength')">
            Username must be at least 3 characters
          </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput 
                 [type]="hidePassword ? 'password' : 'text'"
                 formControlName="password"
                 placeholder="Enter your password"
                 autocomplete="current-password"
                 [disabled]="isLoading">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button 
                  matSuffix 
                  type="button"
                  (click)="hidePassword = !hidePassword"
                  [disabled]="isLoading">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          
          <mat-error *ngIf="passwordField?.hasError('required')">
            Password is required
          </mat-error>
          <mat-error *ngIf="passwordField?.hasError('minlength')">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="error-message">
          <mat-icon>error</mat-icon>
          {{ errorMessage }}
        </div>

        <!-- Submit Button -->
        <button mat-raised-button 
                color="primary" 
                type="submit"
                class="submit-button"
                [disabled]="!loginForm.valid || isLoading">
          <mat-spinner *ngIf="isLoading" diameter="20" class="spinner"></mat-spinner>
          <ng-container *ngIf="!isLoading">
            <mat-icon>login</mat-icon>
            Sign In
          </ng-container>
          <ng-container *ngIf="isLoading">
            Signing in...
          </ng-container>
        </button>

      </form>

    </mat-card-content>

    <mat-card-footer class="login-footer">
      <p class="text-center">
        <small>Test credentials: ahmed / ahmed123</small>
      </p>
    </mat-card-footer>

  </mat-card>
</div>
