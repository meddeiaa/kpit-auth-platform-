<aside class="vex-sidebar"
       [class.collapsed]="collapsed"
       [class.mobile-open]="mobileOpen">

  <div class="sidebar-toolbar">
    <app-brand-logo class="brand" [compact]="collapsed && !mobileOpen"></app-brand-logo>
    <span class="brand-tag" *ngIf="!collapsed || mobileOpen">Test Platform</span>
  </div>

  <nav class="sidebar-nav" aria-label="Main navigation">
    <div *ngFor="let section of filteredSections" class="nav-section">

      <div class="nav-subheading" *ngIf="!collapsed || mobileOpen">
        {{ section.title }}
      </div>
      <div class="nav-divider" *ngIf="collapsed && !mobileOpen"></div>

      <a *ngFor="let item of section.items"
         class="nav-item"
         [class.active]="isRouteActive(item.route)"
         [class.disabled-nav]="!item.route"
         [attr.title]="collapsed && !mobileOpen ? item.label : null"
         (click)="navigateTo(item)"
         matRipple
         [matRippleDisabled]="!item.route"
         matRippleColor="rgba(185, 245, 58, 0.12)">

        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>

        <span class="nav-label" *ngIf="!collapsed || mobileOpen">
          {{ item.label }}
        </span>

        <span class="nav-badge"
              *ngIf="(!collapsed || mobileOpen) && item.badge"
              [ngClass]="'badge-' + item.badge.color">
          {{ item.badge.text }}
        </span>
      </a>
    </div>
  </nav>

  <div class="sidebar-user" *ngIf="!collapsed || mobileOpen">
    <div class="user-avatar">{{ initials }}</div>
    <div class="user-info">
      <div class="user-name">{{ fullName }}</div>
      <div class="user-role">{{ roleLabel }}</div>
    </div>
    <span class="user-online" title="Session active"></span>
  </div>
</aside>
